apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: inventory-service-ingress
  namespace: inventory-service
  annotations:
    # Für cert-manager (Let's Encrypt SSL)
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    # Für nginx ingress
    nginx.ingress.kubernetes.io/rewrite-target: /
    # Weitere Optionen
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  ingressClassName: nginx
  tls:
  - hosts:
    - inventory.example.com  # Ersetzen Sie dies mit Ihrer Domain
    secretName: inventory-tls
  rules:
  - host: inventory.example.com  # Ersetzen Sie dies mit Ihrer Domain
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: inventory-service
            port:
              number: 80
