services:
  inventoryservice:
    build: .
    container_name: inventoryservice
    restart: unless-stopped
    ports:
      - "8081:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ConnectionStrings__DefaultConnection=Host=db-inventory;Database=inventorydb;Username=postgres;Password=${DB_PASSWORD:-postgres}
    depends_on:
      db-inventory:
        condition: service_healthy
    networks:
      - inventory-network
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.5"
        reservations:
          memory: 256M
          cpus: "0.25"

  db-inventory:
    image: postgres:16
    container_name: db-inventory
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: inventorydb
    volumes:
      - inventory_data:/var/lib/postgresql/data
    networks:
      - inventory-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d inventorydb"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  inventory-network:
    driver: bridge

volumes:
  inventory_data:
    driver: local
