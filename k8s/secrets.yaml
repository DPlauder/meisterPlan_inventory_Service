# WICHTIG: Verwenden Sie echte Secrets in Produktion!
# Diese Datei enthält nur Beispiel-Werte für Demonstrationszwecke.
# Erstellen Sie Secrets mit: kubectl create secret generic inventory-secrets --from-literal=POSTGRES_PASSWORD=your-password
apiVersion: v1
kind: Secret
metadata:
  name: inventory-secrets
  namespace: inventory-service
type: Opaque
data:
  # Base64-kodierte Werte (postgres/postgres)
  # Bitte ändern Sie diese Werte in Produktion!
  # Um einen neuen Wert zu kodieren: echo -n 'your-password' | base64
  POSTGRES_PASSWORD: cG9zdGdyZXM=  # "postgres" - BITTE ÄNDERN!
